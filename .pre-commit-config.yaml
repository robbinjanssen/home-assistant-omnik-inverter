---
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Linter
        language: system
        types: [python]
        entry: uv run ruff check --fix
        require_serial: true
        stages: [pre-commit, pre-push, manual]
      - id: ruff-format
        name: Ruff Formatter
        language: system
        types: [python]
        entry: uv run ruff format
        require_serial: true
        stages: [pre-commit, pre-push, manual]
      - id: codespell
        name: Check code for common misspellings
        language: system
        types: [text]
        exclude: ^(uv\.lock$|custom_components/omnik_inverter/translations/)
        args: [--ignore-words=.codespell-ignore, --skip=./custom_components/omnik_inverter/translations]
        entry: uv run codespell
      - id: mypy
        name: Static type checking using mypy
        language: system
        types: [python]
        entry: uv run mypy
        require_serial: true
      - id: uv-lock
        name: Check uv.lock is up to date
        language: system
        entry: uv lock --check
        pass_filenames: false
        always_run: true
      - id: pylint
        name: Starring code with pylint
        language: system
        types: [python]
        entry: uv run pylint
      - id: yamllint
        name: Check YAML files with yamllint
        language: system
        types: [yaml]
        entry: uv run yamllint
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
        stages: [pre-commit, pre-push, manual]
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        stages: [pre-commit, pre-push, manual]
      - id: no-commit-to-branch
        args:
          - --branch=main
      - id: trailing-whitespace
        stages: [pre-commit, pre-push, manual]
