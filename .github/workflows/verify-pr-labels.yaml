---
name: PR Labels

on:
  pull_request_target:
    types: [opened, labeled, unlabeled, synchronize]
  workflow_call:

permissions:
  pull-requests: read

jobs:
  pr-labels:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Verify PR has a valid label
        uses: mheap/github-action-required-labels@v5.6.0
        with:
          mode: minimum
          count: 1
          labels: |
            breaking-change
            bugfix
            hotfix
            documentation
            enhancement
            refactor
            performance
            new-feature
            maintenance
            ci
            dependencies
            skip-changelog
