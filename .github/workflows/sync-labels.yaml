---
name: Sync labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/labels.yml

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Sync labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v6.0.0
        with:
          yaml-file: .github/labels.yml
